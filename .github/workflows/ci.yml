name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Block on what ships in the server image. Build-only tools are reported
      # but not blocking: GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, via
      # vite-plugin-singlefile) has no patched release to move to.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit build tooling (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - run: node --check scripts/check-release-readiness.mjs
      - run: node --check scripts/set-release-metadata.mjs
      - run: az bicep build --file infra/foundation.bicep --stdout > /dev/null
      - run: az bicep build --file infra/container-app.bicep --stdout > /dev/null
      - run: docker build -t parkassist-copilot:ci .

  verify-copilot-component:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilotComponent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: copilotComponent/package-lock.json
      - run: npm ci
      - run: npm run build
      # Production dependencies (bundled into the .sppkg) still block. Every current
      # finding is in the SPFx/Heft build toolchain, and npm's suggested fixes
      # downgrade SPFx below the 1.24 that Copilot Components require.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit build tooling (report only)
        run: npm audit --audit-level=moderate
        continue-on-error: true
