name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: node --check scripts/check-release-readiness.mjs
      - run: node --check scripts/set-release-metadata.mjs
      - run: az bicep build --file infra/foundation.bicep --stdout > /dev/null
      - run: az bicep build --file infra/container-app.bicep --stdout > /dev/null
      - run: docker build -t parkassist-copilot:ci .

  verify-copilot-component:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilotComponent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: copilotComponent/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
