swagger: '2.0'
info:
  title: ParkAssist Garage MCP
  description: Live read-only parking, license-plate, and camera-health tools for 5 Bell.
  version: 1.0.0
host: your-service.example.com
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Invoke the ParkAssist Streamable HTTP MCP server
      operationId: InvokeParkAssistMCP
      x-ms-agentic-protocol: mcp-streamable-1.0
      responses:
        '200':
          description: Success
securityDefinitions:
  apiKeyHeader:
    type: apiKey
    name: x-api-key
    in: header
security:
  - apiKeyHeader: []
